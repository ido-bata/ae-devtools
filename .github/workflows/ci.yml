name: ci

# Automated verification for ticket PRs. The only other workflow
# (release-source-check.yml) fires on PRs into `main`; ticket PRs target
# release-x-y-z branches and previously ran no checks at all.
#
# Each job detects whether its surface exists on the head tree and skips
# cleanly when it does not, so the same file serves every ticket branch.

on:
  pull_request:

# Superseded PR pushes cancel their stale runs instead of occupying
# runners until the platform default timeout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-config:
    # Syntax-level YAML parse only — this does NOT validate GitHub
    # workflow/issue-form schemas.
    name: github-config (issue templates + workflow YAML syntax parse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Parse GitHub config YAML
        run: |
          set -euo pipefail
          fail=0
          for f in .github/ISSUE_TEMPLATE/*.yml .github/ISSUE_TEMPLATE/*.yaml .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            # Pass the path via ARGV — interpolating "$f" into the Ruby
            # source would break (or inject) on filenames containing
            # quotes. Surface the parser diagnostic, not just "invalid".
            if ! err=$(ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f" 2>&1); then
              # Escape %, CR and LF: a filename is PR-controlled and a
              # raw newline/% in a workflow command property is parsed
              # as command injection by the runner.
              escf=$(printf '%s' "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              escm=$(printf '%s' "$err" | head -1 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error file=$escf::invalid YAML: $escm"
              fail=1
            fi
          done
          exit "$fail"

      - name: github-rulesets contract tests
        # Pure decision logic only — no GitHub API access (Issue #361).
        run: node --test scripts/github-rulesets.test.mjs

  skills-lock:
    name: skills-lock (vendored skills vs skills-lock.json)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect lock file
        id: detect
        run: |
          # The verifier needs the lock file AND the vendored skills/
          # tree AND the script itself — probing only the lock file
          # would fail with MODULE_NOT_FOUND/ENOENT on a partial head
          # instead of skipping cleanly (Issue #246).
          if [ -f skills-lock.json ] && [ -f scripts/verify-skills-lock.mjs ] && [ -d skills ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skills-lock surface incomplete on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node scripts/verify-skills-lock.mjs

  capability-catalog:
    name: capability-catalog (bun test / typecheck / verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Ticket-stage verify only: manifest/domain-coverage freshness + drift
      # gate. The candidate-bound conformance gate runs at the release stage
      # in release-source-check.yml (`bun run conformance-gate`), so this job
      # does not need full history.
      - uses: actions/checkout@v7
      - name: Detect package
        id: detect
        run: |
          if [ -f packages/capability-catalog/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packages/capability-catalog not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bun install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bun test
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bunx tsc --noEmit
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bun run verify

  native-adapter:
    name: native-adapter (bun test / typecheck / verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect package
        id: detect
        run: |
          if [ -f packages/native-adapter/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packages/native-adapter not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun test
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bunx tsc --noEmit
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun run verify

  inventories:
    # inventories/* feed capability-catalog's committed inputs; without
    # this job a stale generated/*.json or broken extractor flowed
    # through every downstream gate undetected (Issue #231).
    name: inventories (bun test / typecheck / verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect inventories
        id: detect
        run: |
          any=false
          for d in tools scripting sdk; do
            if [ -d "inventories/$d" ]; then
              echo "$d=true" >> "$GITHUB_OUTPUT"
              any=true
            else
              echo "$d=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.any == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.detect.outputs.tools == 'true'
        working-directory: inventories/tools
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit
      - if: steps.detect.outputs.scripting == 'true'
        working-directory: inventories/scripting
        run: |
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit
      # scripting `verify` rebuilds from the git-ignored .cache/ payloads
      # and falls back to fetching Adobe helpx when they are absent — the
      # CDN 403s CI runners, so this is an explicit, annotated skip where
      # the cache is not provisioned (never silent; Issue #231). ALL
      # payload keys declared in scripts/sources.ts are required — a
      # partial cache would run verify and fail on the missing payloads
      # (Issue #246).
      - if: steps.detect.outputs.scripting == 'true'
        working-directory: inventories/scripting
        run: |
          missing=""
          for k in $(grep -oE 'key: "[^"]+"' scripts/sources.ts | sed -E 's/key: "([^"]+)"/\1/'); do
            [ -f ".cache/$k.payload" ] || missing="$missing $k"
          done
          if [ -z "$missing" ]; then
            bun run verify
          else
            echo "::notice::inventories/scripting verify skipped: .cache payloads missing:$missing (byte-identical rebuild deferred to a provisioned host)"
          fi
      # tools `verify` needs the git-ignored .reference clones for every
      # registry entry (network-provisioned); CI has none, so this is an
      # explicit, annotated skip — never silent. The required set is
      # derived from scripts/registry.ts (ae-a8n + every cloneDir) so a
      # newly registered tool automatically joins the probe (Issue #246).
      # On a host with all clones provisioned the same command runs
      # citation + byte-identity verification.
      - if: steps.detect.outputs.tools == 'true'
        working-directory: inventories/tools
        run: |
          required="ae-a8n"
          for d in $(grep -oE 'cloneDir: "[^"]+"' scripts/registry.ts | sed -E 's/cloneDir: "([^"]+)"/\1/'); do
            required="$required $d"
          done
          missing=""
          for d in $required; do
            [ -d "../../.reference/$d" ] || missing="$missing $d"
          done
          if [ -z "$missing" ]; then
            bun run verify
          else
            echo "::notice::inventories/tools verify skipped: .reference clones missing:$missing (citation + byte-identity checks deferred to a provisioned host)"
          fi
      # inventories/sdk has no package.json by design (generated data +
      # scripts only); its two test files are wired here explicitly —
      # the .ts extractor test under bun, the .mjs matrix test under
      # node:test (Issue #231).
      - if: steps.detect.outputs.sdk == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - if: steps.detect.outputs.sdk == 'true'
        run: |
          bun test inventories/sdk/scripts/extract-sdk-inventory.test.ts
          node --test inventories/sdk/scripts/coverage-matrix.test.mjs

  read-only-probe:
    name: read-only-probe (node:test, fake responder)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect probe
        id: detect
        run: |
          if [ -f experiments/read-only-probe/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/read-only-probe not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/read-only-probe/tests/run.mjs

  ae-devtools-cli:
    name: ae-devtools-cli (packaged suites + consumer smoke, fake-level)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # engines.node is ">=22"; exercise both the minimum and the current
    # LTS line (the pre-merge jobs pinned 22 and 24 respectively).
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - name: Detect package
        id: detect
        run: |
          if [ -f packages/ae-devtools-cli/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packages/ae-devtools-cli not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/ae-devtools-cli/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/ae-devtools-cli
        run: npm ci
      # xmllint is required for the cep-extension XSD contract test —
      # without it that test would silently skip and the contract
      # would be unverified.
      - if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      # The XSD contract test hard-fails without xmllint when this is
      # set — a silent skip in CI would leave the contract unverified.
      - if: steps.detect.outputs.present == 'true'
        run: echo "AE_DEVTOOLS_REQUIRE_XMLLINT=1" >> "$GITHUB_ENV"
      # Static syntax gate over the shipped .mjs surface (Issue #185) —
      # the package has no typecheck step, so node --check is the
      # minimal honest static check wired into CI.
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/ae-devtools-cli
        run: node scripts/check-syntax.mjs
      # Run every suite even when an earlier one fails, so a single
      # broken suite cannot hide the status of the rest. Each suite is
      # also guarded individually: a head that has the package but not
      # every suite directory (older ticket branches) skips cleanly
      # instead of aborting on MODULE_NOT_FOUND.
      - if: steps.detect.outputs.present == 'true'
        run: |
          set -uo pipefail
          fail=0
          ran=0
          # Discover suites from the filesystem — a hardcoded list here
          # and in package.json "test" would drift, letting a new suite
          # silently never run in CI (Issue #232).
          for runner in packages/ae-devtools-cli/*/tests/run.mjs; do
            [ -f "$runner" ] || continue
            d=$(echo "$runner" | cut -d/ -f3)
            ran=$((ran + 1))
            echo "=== $d ==="
            if ! node "$runner"; then
              echo "::error::suite $d failed"
              fail=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::no ae-devtools-cli suites found on this head"
            exit 1
          fi
          exit "$fail"
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/ae-devtools-cli
        run: npm run smoke:consumer
      # Committed generated files must match their generators — same
      # freshness contract as capability-catalog's `verify` byte-compare.
      - if: steps.detect.outputs.present == 'true'
        run: |
          node packages/ae-devtools-cli/scripting-adapters/scripts/coverage-claims.mjs
          # gen-ae-types reads inventories/scripting/generated/symbols.json
          # which lives outside this job's detected surface — skip with a
          # notice on a head that carries the CLI package but not the
          # inventory (Issue #246).
          if [ -f inventories/scripting/generated/symbols.json ]; then
            node packages/ae-devtools-cli/jsx-toolchain/src/gen-ae-types.mjs
          else
            echo "::notice::ae-api.d.ts freshness check skipped: inventories/scripting/generated/symbols.json not on this head"
          fi
          # Stage-then-diff so untracked generator outputs and renames
          # fail too — plain `git diff` only sees tracked modifications
          # (Issue #246).
          git add -A -- \
            packages/ae-devtools-cli/scripting-adapters/generated/coverage-claims.json \
            packages/ae-devtools-cli/jsx-toolchain/src/ae-api.d.ts
          git diff --cached --exit-code -- \
            packages/ae-devtools-cli/scripting-adapters/generated/coverage-claims.json \
            packages/ae-devtools-cli/jsx-toolchain/src/ae-api.d.ts

  cep-panel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/runtime-bridge/cep-panel/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cep-panel contract tests not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      # xmllint is required for the XSD contract test — without it the
      # test would silently skip and the contract would be unverified.
      - if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      # The XSD contract test hard-fails without xmllint when this is
      # set — a silent skip in CI would leave the contract unverified.
      - if: steps.detect.outputs.present == 'true'
        run: echo "AE_DEVTOOLS_REQUIRE_XMLLINT=1" >> "$GITHUB_ENV"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/runtime-bridge/cep-panel/tests/run.mjs
