      - if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun test
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bunx tsc --noEmit
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun run verify

  read-only-probe:
    name: read-only-probe (node:test, fake responder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect probe
        id: detect
        run: |
          if [ -f experiments/read-only-probe/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/read-only-probe not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/read-only-probe/tests/run.mjs

  trusted-execution:
    name: trusted-execution (node:test, codec fake-level)
