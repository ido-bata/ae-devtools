name: ci

# Automated verification for ticket PRs. The only other workflow
# (release-source-check.yml) fires on PRs into `main`; ticket PRs target
# release-x-y-z branches and previously ran no checks at all.
#
# Each job detects whether its surface exists on the head tree and skips
# cleanly when it does not, so the same file serves every ticket branch.

on:
  pull_request:

permissions:
  contents: read

jobs:
  capability-catalog:
    name: capability-catalog (bun test / typecheck / verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: detect
        run: |
          if [ -f packages/capability-catalog/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packages/capability-catalog not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bun install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bun test
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bunx tsc --noEmit
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/capability-catalog
        run: bun run verify

  native-adapter:
    name: native-adapter (bun test / typecheck / verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: detect
        run: |
          if [ -f packages/native-adapter/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packages/native-adapter not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun test
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bunx tsc --noEmit
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/native-adapter
        run: bun run verify

  read-only-probe:
    name: read-only-probe (node:test, fake responder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect probe
        id: detect
        run: |
          if [ -f experiments/read-only-probe/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/read-only-probe not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/read-only-probe/tests/run.mjs

  ae-devtools-cli:
    name: ae-devtools-cli (packaged suites + consumer smoke, fake-level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: detect
        run: |
          if [ -f packages/ae-devtools-cli/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "packages/ae-devtools-cli not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/ae-devtools-cli
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: |
          set -e
          for d in trusted-execution scripting-adapters dev-loop devtools-cli a8n-transport mcp-server jsx-toolchain; do
            echo "=== $d ==="
            node "packages/ae-devtools-cli/$d/tests/run.mjs"
          done
      - if: steps.detect.outputs.present == 'true'
        working-directory: packages/ae-devtools-cli
        run: npm run smoke:consumer

  cep-extension:
    name: cep-extension (node:test, scaffold fake-level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/cep-extension/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/cep-extension not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # xmllint is required for the XSD contract test — without it the
      # test would silently skip and the contract would be unverified.
      - if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/cep-extension/tests/run.mjs

  diagnostics:
    name: diagnostics (node:test, record schema fake-level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/diagnostics/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/diagnostics not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/diagnostics/tests/run.mjs

  agent-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/agent-loop/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/agent-loop not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/agent-loop/tests/run.mjs

  cep-panel-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/runtime-bridge/cep-panel/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "cep-panel contract tests not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # xmllint is required for the XSD contract test — without it the
      # test would silently skip and the contract would be unverified.
      - if: steps.detect.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/runtime-bridge/cep-panel/tests/run.mjs
  vscode-debugger:
    name: vscode-debugger (launch.json contract, no AE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/vscode-debugger/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/vscode-debugger not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        working-directory: experiments/vscode-debugger
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/vscode-debugger/tests/run.mjs

  recovery-orchestrator:
    name: recovery-orchestrator (node:test, fake-level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: detect
        run: |
          if [ -f experiments/recovery-orchestrator/tests/run.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "experiments/recovery-orchestrator not on this head; skipping"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.detect.outputs.present == 'true'
        run: node experiments/recovery-orchestrator/tests/run.mjs
